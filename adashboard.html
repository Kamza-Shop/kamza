<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamza Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    .green { background: #009f3d; }
    .green-text { color: #009f3d; }

    .sidebar {
      width: 291px;
    }

    .main {
      margin-left: 291px;
    }

    .nav-link {
      color: #777;
      transition: .15s ease;
    }

    .nav-link:hover {
      background: #f5f7f6;
      color: #111;
    }

    .nav-link.active {
      background: #009f3d;
      color: white;
      font-weight: 600;
    }

    .stat-card {
      height: 120px;
    }

    .chart-card {
      height: 372px;
    }

    .bottom-card {
      height: 346px;
    }

    @media (max-width: 1050px) {
      .sidebar { width: 220px; }
      .main { margin-left: 220px; }
      .topbar { padding-left: 30px !important; padding-right: 25px !important; }
      .dashboard-content { padding: 20px !important; }
    }

    @media (max-width: 780px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .mobile-menu { display: flex !important; }
      .top-search { width: 50% !important; }
      .stats { grid-template-columns: 1fr 1fr !important; }
      .bottom-grid { grid-template-columns: 1fr !important; }
    }

    @media (max-width: 520px) {
      .top-search { display: none !important; }
      .topbar { height: 76px !important; }
      .dashboard-content { padding: 12px !important; }
      .stats { grid-template-columns: 1fr !important; }
      .chart-card { height: 330px; }
      .bottom-card { height: 300px; }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar fixed left-0 top-0 bottom-0 bg-white z-30">
    <div class="h-[101px] flex items-center pl-[88px]">
      <a href="#" class="text-[39px] leading-none font-bold tracking-[-1.8px] green-text">
        Kamza
      </a>
    </div>

    <nav class="px-[29px] pt-[19px] text-[15px]">
      <a href="#" class="nav-link active flex items-center gap-4 h-[53px] px-[25px] rounded-xl mb-[2px]">
        <i data-lucide="house" class="w-[21px] h-[21px]"></i>
        <span>Dashboard</span>
      </a>

      <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
        <i data-lucide="receipt-text" class="w-[21px] h-[21px]"></i>
        <span>Orders</span>
      </a>

      <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
        <i data-lucide="users-round" class="w-[21px] h-[21px]"></i>
        <span>Customers</span>
      </a>

      <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
        <i data-lucide="message-circle" class="w-[21px] h-[21px]"></i>
        <span>Messages</span>
      </a>

      <div class="border-t border-[#ddd] mt-[22px] pt-[27px]">
        <div class="px-[27px] text-[12px] font-semibold text-[#999] mb-[10px]">
          TOOLS
        </div>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="package" class="w-[21px] h-[21px]"></i>
          <span>Products</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="blocks" class="w-[21px] h-[21px]"></i>
          <span>Integrations</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="chart-no-axes-column" class="w-[21px] h-[21px]"></i>
          <span>Analytics</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="file-text" class="w-[21px] h-[21px]"></i>
          <span>Invoice</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="clipboard-check" class="w-[21px] h-[21px]"></i>
          <span>Inventory</span>
        </a>
      </div>

      <div class="border-t border-[#ddd] mt-[22px] pt-[27px]">
        <div class="px-[27px] text-[12px] font-semibold text-[#999] mb-[10px]">
          SETTINGS
        </div>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="settings" class="w-[21px] h-[21px]"></i>
          <span>Settings</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="shield" class="w-[21px] h-[21px]"></i>
          <span>Security</span>
        </a>

        <a href="#" class="nav-link flex items-center gap-4 h-[50px] px-[25px] rounded-xl">
          <i data-lucide="circle-help" class="w-[21px] h-[21px]"></i>
          <span>Help</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main min-h-screen bg-[#eef4f0]">

    <!-- Header -->
    <header class="topbar h-[101px] bg-white flex items-center px-[40px]">
      <button id="mobileMenu" class="mobile-menu hidden w-10 h-10 rounded-lg bg-gray-100 items-center justify-center mr-4">
        <i data-lucide="menu"></i>
      </button>

      <div class="top-search w-[551px] h-[40px] rounded-full bg-[#e7e7e7] flex items-center px-5">
        <i data-lucide="search" class="w-[20px] h-[20px] mr-2"></i>
        <input id="globalSearch"
               type="text"
               placeholder="Search..."
               class="w-full bg-transparent outline-none text-[14px]">
      </div>

      <div class="ml-auto flex items-center gap-[25px]">
        <button class="relative hover:text-[#009f3d]">
          <i data-lucide="message-circle" class="w-[21px]"></i>
          <span class="absolute -right-1 -top-1 w-[7px] h-[7px] rounded-full bg-[#aaa]"></span>
        </button>

        <button class="relative hover:text-[#009f3d]">
          <i data-lucide="bell" class="w-[21px]"></i>
          <span class="absolute -right-1 -top-1 w-[7px] h-[7px] rounded-full bg-red-500"></span>
        </button>

        <button id="profileButton" class="flex items-center gap-2">
          <div class="w-[40px] h-[40px] rounded-full bg-[#f4c69f] flex items-center justify-center text-xl">
            👩🏽
          </div>
          <span class="font-semibold text-[14px]">Jayne Okon</span>
          <i data-lucide="chevron-down" class="w-[14px] text-gray-500"></i>
        </button>
      </div>
    </header>

    <main class="dashboard-content p-[29px]">
      <div class="max-w-[1017px] mx-auto">

        <!-- Stats -->
        <section class="stats grid grid-cols-4 gap-[23px]">

          <div class="stat-card bg-white rounded-[9px] flex items-center px-[28px]">
            <div class="w-[41px] h-[37px] rounded-[6px] bg-[#d9fae7] green-text flex items-center justify-center mr-[16px]">
              <i data-lucide="users-round" class="w-[23px] h-[23px]"></i>
            </div>
            <div>
              <div class="text-[23px] font-bold leading-[27px]">3000+</div>
              <div class="text-[14px] text-[#777] mt-[4px]">Total Customers</div>
            </div>
          </div>

          <div class="stat-card bg-white rounded-[9px] flex items-center px-[28px]">
            <div class="w-[41px] h-[37px] rounded-[6px] bg-[#ebe3ff] text-[#4a20c8] flex items-center justify-center mr-[16px]">
              <i data-lucide="package" class="w-[23px] h-[23px]"></i>
            </div>
            <div>
              <div class="text-[23px] font-bold leading-[27px]">50+</div>
              <div class="text-[14px] text-[#777] mt-[4px]">Total Products</div>
            </div>
          </div>

          <div class="stat-card bg-white rounded-[9px] flex items-center px-[28px]">
            <div class="w-[41px] h-[37px] rounded-[6px] bg-[#fff1dc] text-[#ad6200] flex items-center justify-center mr-[16px]">
              <i data-lucide="file-text" class="w-[23px] h-[23px]"></i>
            </div>
            <div>
              <div class="text-[23px] font-bold leading-[27px]">500+</div>
              <div class="text-[14px] text-[#777] mt-[4px]">Total Orders</div>
            </div>
          </div>

          <div class="stat-card bg-white rounded-[9px] flex items-center px-[28px]">
            <div class="w-[41px] h-[37px] rounded-[6px] bg-[#ededed] text-[#777] flex items-center justify-center mr-[16px]">
              <i data-lucide="chart-no-axes-column" class="w-[23px] h-[23px]"></i>
            </div>
            <div>
              <div class="text-[23px] font-bold leading-[27px]">1500+</div>
              <div class="text-[14px] text-[#777] mt-[4px]">Total Sales</div>
            </div>
          </div>
        </section>

        <!-- Sales Overview -->
        <section class="chart-card bg-white rounded-[9px] mt-[39px] p-[26px]">
          <h2 class="font-bold text-[17px] mb-[25px]">Sales Overview</h2>
          <div class="h-[285px]">
            <canvas id="salesChart"></canvas>
          </div>
        </section>

        <!-- Bottom cards -->
        <section class="bottom-grid grid grid-cols-[1fr_319px] gap-[29px] mt-[13px]">

          <div class="bottom-card bg-white rounded-[9px] p-[26px] relative">
            <h2 class="font-bold text-[17px]">All Orders</h2>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div class="w-[135px] h-[28px] bg-[#aaa]"></div>
            </div>
          </div>

          <div class="bottom-card bg-white rounded-[9px] p-[26px]">
            <h2 class="font-bold text-[17px]">Top Sold Items</h2>
          </div>

        </section>
      </div>
    </main>
  </div>

  <div id="toast"
       class="fixed right-5 bottom-5 bg-[#111] text-white px-5 py-3 rounded-lg shadow-lg text-sm opacity-0 translate-y-4 pointer-events-none transition-all">
  </div>

<script>
  lucide.createIcons();

  const toast = document.getElementById('toast');

  function showToast(message) {
    toast.textContent = message;
    toast.classList.remove('opacity-0', 'translate-y-4');
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-4');
    }, 2200);
  }

  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.nav-link').forEach(x => x.classList.remove('active'));
      link.classList.add('active');
      showToast(link.textContent.trim());
    });
  });

  document.getElementById('profileButton').addEventListener('click', () => {
    showToast('Profile menu');
  });

  document.getElementById('globalSearch').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      showToast(e.target.value.trim() ? 'Searching...' : 'Enter a search term');
    }
  });

  document.getElementById('mobileMenu').addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar');
    sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
    sidebar.style.width = '291px';
    sidebar.style.background = '#fff';
    sidebar.style.boxShadow = '0 10px 30px rgba(0,0,0,.12)';
  });

  // Sales chart matching the screenshot's smooth green line.
  const ctx = document.getElementById('salesChart').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      datasets: [{
        data: [1.1, 3.1, 3.0, 5.5, 1.5, 3.8, 3.2, 2.7, 4.6, 7.1, 6.4, 4.0],
        borderColor: '#009f3d',
        borderWidth: 3,
        pointRadius: 0,
        tension: 0.45,
        fill: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => '₦' + context.parsed.y + 'M'
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: {
            color: '#111',
            font: { size: 14 }
          }
        },
        y: {
          min: 0,
          max: 12,
          ticks: {
            stepSize: 2,
            color: '#111',
            font: { size: 14 },
            callback: value => '₦' + value + 'M'
          },
          grid: {
            color: '#d9d9d9',
            lineWidth: 1
          },
          border: { display: false }
        }
      }
    }
  });
</script>
</body>
</html>
