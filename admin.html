<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamza Admin — Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;color:#111;background:#fff}
    .green{background:#009f3d}.green-text{color:#009f3d}
    .sidebar{width:291px}
    .main{margin-left:291px}
    .product-row{height:69px}
    .product-img{width:49px;height:49px;object-fit:cover;border-radius:6px}
    select{appearance:none;-webkit-appearance:none}
    .page-btn.active{background:#d8f8e4;color:#009f3d;font-weight:600}
    @media(max-width:1000px){
      .sidebar{width:220px}.main{margin-left:220px}
      .topbar{padding-left:30px!important;padding-right:25px!important}
      .content{padding:20px!important}
    }
    @media(max-width:760px){
      .sidebar{display:none}.main{margin-left:0}
      .mobile-menu{display:flex!important}
      .topbar{padding:0 18px!important}
      .top-search{width:45%!important}
      .filter-grid{grid-template-columns:1fr 1fr!important}
      .toolbar{flex-wrap:wrap}
      .toolbar .search-box{width:100%!important}
      .table-scroll{overflow-x:auto}
      table{min-width:920px}
    }
    @media(max-width:520px){
      .top-search{display:none!important}
      .filter-grid{grid-template-columns:1fr!important}
      .content{padding:10px!important}
      .toolbar-actions{margin-left:0!important}
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar fixed left-0 top-0 bottom-0 bg-white border-r border-gray-100 z-30">
    <div class="h-[101px] flex items-center pl-[88px]">
      <a href="#" class="text-[39px] leading-none font-bold tracking-[-1.8px] green-text">Kamza</a>
    </div>

    <nav class="px-[29px] pt-[20px] text-[15px] text-[#777]">
      <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
        <i data-lucide="house" class="w-[20px]"></i><span>Dashboard</span>
      </a>
      <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
        <i data-lucide="receipt-text" class="w-[20px]"></i><span>Orders</span>
      </a>
      <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
        <i data-lucide="users-round" class="w-[20px]"></i><span>Customers</span>
      </a>
      <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
        <i data-lucide="message-circle" class="w-[20px]"></i><span>Messages</span>
      </a>

      <div class="border-t border-[#ddd] mt-[22px] pt-[27px]">
        <div class="px-[27px] text-[12px] font-semibold text-[#999] mb-[10px]">TOOLS</div>

        <a class="nav-item selected flex items-center gap-4 h-[52px] px-[25px] rounded-xl text-white font-semibold green mb-[2px]" href="#">
          <i data-lucide="package" class="w-[20px]"></i><span>Products</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="blocks" class="w-[20px]"></i><span>Integrations</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="chart-no-axes-column" class="w-[20px]"></i><span>Analytics</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="file-text" class="w-[20px]"></i><span>Invoice</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="clipboard-check" class="w-[20px]"></i><span>Inventory</span>
        </a>
      </div>

      <div class="border-t border-[#ddd] mt-[22px] pt-[27px]">
        <div class="px-[27px] text-[12px] font-semibold text-[#999] mb-[10px]">SETTINGS</div>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="settings" class="w-[20px]"></i><span>Settings</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="shield" class="w-[20px]"></i><span>Security</span>
        </a>
        <a class="nav-item flex items-center gap-4 h-[50px] px-[25px] rounded-xl hover:bg-gray-50" href="#">
          <i data-lucide="circle-help" class="w-[20px]"></i><span>Help</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main min-h-screen bg-[#eef4f0]">
    <!-- Header -->
    <header class="topbar h-[101px] bg-white flex items-center px-[40px]">
      <button id="mobileMenu" class="mobile-menu hidden mr-4 w-10 h-10 rounded-lg bg-gray-100 items-center justify-center">
        <i data-lucide="menu"></i>
      </button>

      <div class="top-search ml-[1px] w-[551px] h-[40px] bg-[#e7e7e7] rounded-full flex items-center px-5">
        <i data-lucide="search" class="w-[20px] text-[#222] mr-2"></i>
        <input id="globalSearch" class="bg-transparent outline-none w-full text-[14px]" placeholder="Search..." />
      </div>

      <div class="ml-auto flex items-center gap-[25px]">
        <button class="relative">
          <i data-lucide="message-circle" class="w-[21px]"></i>
          <span class="absolute -right-1 -top-1 w-[7px] h-[7px] rounded-full bg-[#aaa]"></span>
        </button>
        <button class="relative">
          <i data-lucide="bell" class="w-[21px]"></i>
          <span class="absolute -right-1 -top-1 w-[7px] h-[7px] rounded-full bg-red-500"></span>
        </button>
        <button id="profile" class="flex items-center gap-2">
          <div class="w-[40px] h-[40px] rounded-full bg-[#f5c69f] flex items-center justify-center text-xl">👩🏽</div>
          <span class="font-semibold text-[14px]">Jayne Okon</span>
          <i data-lucide="chevron-down" class="w-[14px] text-gray-500"></i>
        </button>
      </div>
    </header>

    <main class="content p-[29px]">
      <div class="max-w-[1017px] mx-auto">

        <!-- Toolbar -->
        <section class="bg-white rounded-[9px] px-[26px] py-[17px]">
          <div class="toolbar flex items-center gap-[14px]">
            <div class="search-box w-[267px] h-[43px] bg-[#e7e7e7] rounded-[9px] flex items-center px-[17px]">
              <i data-lucide="search" class="w-[19px] text-gray-600 mr-2"></i>
              <input id="customerSearch" class="bg-transparent outline-none w-full text-[14px]" placeholder="Search customers...">
            </div>

            <div class="relative w-[188px] h-[43px]">
              <select id="showFilter" class="w-full h-full bg-[#e7e7e7] rounded-[9px] px-[16px] pr-9 text-[14px]">
                <option>All Products</option><option>Active Products</option><option>Inactive Products</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              <span class="absolute left-[16px] top-[13px] pointer-events-none text-[14px]">Show: <b id="showText"></b></span>
            </div>

            <div class="relative w-[165px] h-[43px]">
              <select id="sortFilter" class="w-full h-full bg-[#e7e7e7] rounded-[9px] px-[16px] pr-9 text-[14px]">
                <option>Default</option><option>Name</option><option>Price: Low to High</option><option>Price: High to Low</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              <span class="absolute left-[16px] top-[13px] pointer-events-none text-[14px]">Sort by: <b id="sortText"></b></span>
            </div>

            <div class="ml-auto flex gap-3 toolbar-actions">
              <button id="filterBtn" class="h-[43px] px-[17px] rounded-[9px] bg-[#dcdcdc] text-[#666] flex items-center gap-2 text-[14px] font-medium">
                <i data-lucide="sliders-horizontal" class="w-[18px]"></i>Filter
              </button>
              <button id="addBtn" class="h-[43px] px-[19px] rounded-[9px] green text-white flex items-center gap-2 text-[14px] font-semibold">
                <i data-lucide="plus" class="w-[19px]"></i>Add Product
              </button>
            </div>
          </div>
        </section>

        <!-- Filters -->
        <section class="bg-white rounded-[9px] mt-[6px] px-[26px] pt-[20px] pb-[37px]">
          <div class="filter-grid grid grid-cols-4 gap-[12px]">
            <div>
              <label class="block text-[14px] font-semibold mb-[7px]">Category</label>
              <div class="relative">
                <select class="w-full h-[44px] bg-[#e7e7e7] rounded-[9px] px-[15px] text-[14px]">
                  <option>All(12)</option><option>Home & Kitchen (0)</option><option>Beauty & Health (2)</option><option>Jewelleries & Accessories (0)</option><option>Electronics (0)</option><option>Automotives (0)</option><option>Women's Clothing (0)</option><option>Men's Clothing (0)</option><option>Appliances (6)</option><option>Equipment (0)</option><option>Bags & Luggage (2)</option><option>Women's Shoes (0)</option><option>Men's Shoes (0)</option><option>Sneakers (0)</option><option>Flat Shoes (1)</option><option>Gadgets (1)</option><option>Food Items (0)</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              </div>
            </div>
            <div>
              <label class="block text-[14px] font-semibold mb-[7px]">Status</label>
              <div class="relative">
                <select id="statusFilter" class="w-full h-[44px] bg-[#e7e7e7] rounded-[9px] px-[15px] text-[14px]">
                  <option>All Status</option><option>Active</option><option>Draft</option><option>Out of Stock</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              </div>
            </div>
            <div>
              <label class="block text-[14px] font-semibold mb-[7px]">Price</label>
              <div class="relative">
                <select class="w-full h-[44px] bg-[#e7e7e7] rounded-[9px] px-[15px] text-[14px]">
                  <option>All Prices</option><option>Below ₦10,000</option><option>₦10,000 - ₦50,000</option><option>₦50,000 - ₦100,000</option><option>₦100,000 - ₦500,000</option><option>Above ₦500,000</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              </div>
            </div>
            <div>
              <label class="block text-[14px] font-semibold mb-[7px]">Date Added</label>
              <div class="relative">
                <select class="w-full h-[44px] bg-[#e7e7e7] rounded-[9px] px-[15px] text-[14px]">
                  <option>All Time</option><option>Today</option><option>Yesterday</option><option>Last 7 Days</option><option>Last 30 Days</option><option>Last 90 Days</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-3 w-5 pointer-events-none text-gray-500"></i>
              </div>
            </div>
          </div>
        </section>

        <!-- Table -->
        <section class="mt-[2px] bg-white rounded-[9px] min-h-[719px] px-[26px]">
          <div class="table-scroll overflow-x-auto">
            <table class="w-full border-collapse">
              <thead>
                <tr class="h-[64px] border-b border-[#d8d8d8] text-[#707070] text-[14px]">
                  <th class="text-left w-[34px]">
                    <input id="selectAll" type="checkbox" class="w-[19px] h-[19px] accent-[#009f3d]">
                  </th>
                  <th class="text-left font-medium w-[237px]">Product Name</th>
                  <th class="text-left font-medium w-[190px]">Purchase Unit Price <span>↕</span></th>
                  <th class="text-left font-medium w-[115px]">Quantity <span>↕</span></th>
                  <th class="text-left font-medium w-[95px]">Views <span>↕</span></th>
                  <th class="text-left font-medium w-[126px]">Status <span>↕</span></th>
                  <th class="text-right font-medium">Action</th>
                </tr>
              </thead>
              <tbody id="productBody"></tbody>
            </table>
          </div>

          <div id="pagination" class="flex justify-center items-center gap-[17px] pt-[53px] pb-[24px] text-[13px] text-[#777]">
            <button data-page="prev" class="p-1"><i data-lucide="chevron-left" class="w-4"></i></button>
            <button data-page="1" class="page-btn active w-[25px] h-[25px] rounded-md">1</button>
            <button data-page="2" class="page-btn">2</button>
            <button data-page="3" class="page-btn">3</button>
            <button data-page="4" class="page-btn">4</button>
            <button data-page="5" class="page-btn">5</button>
            <button data-page="6" class="page-btn">6</button>
            <span>...</span>
            <button data-page="50" class="page-btn">50</button>
            <button data-page="next" class="p-1"><i data-lucide="chevron-right" class="w-4"></i></button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Add Product Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 items-center justify-center p-5">
    <div class="bg-white rounded-2xl w-full max-w-[500px] p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <div><h2 class="text-xl font-bold">Add Product</h2><p class="text-sm text-gray-500">Add a new product to your store.</p></div>
        <button id="closeModal" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center"><i data-lucide="x"></i></button>
      </div>
      <form id="productForm" class="space-y-4">
        <input id="name" required class="w-full h-11 border rounded-lg px-3 outline-none" placeholder="Product name">
        <div class="grid grid-cols-2 gap-3">
          <input id="price" required type="number" class="h-11 border rounded-lg px-3 outline-none" placeholder="Price">
          <input id="qty" required type="number" class="h-11 border rounded-lg px-3 outline-none" placeholder="Quantity">
        </div>
        <button class="w-full h-11 rounded-lg green text-white font-semibold">Add Product</button>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed right-5 bottom-5 bg-[#111] text-white px-5 py-3 rounded-lg opacity-0 translate-y-4 pointer-events-none transition-all text-sm"></div>

<script>
  lucide.createIcons();

  const products = [
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:7000,qty:1,views:500,img:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:7000,qty:1,views:500,img:"https://images.unsplash.com/photo-1560343090-f0409e92791a?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:8000,qty:2,views:1041,img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:10000,qty:1,views:45,img:"https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:6000,qty:1,views:205,img:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:12000,qty:2,views:2004,img:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:15000,qty:1,views:551,img:"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=120&q=80"},
    {name:"Women’s Large Vi...",sku:"SKU KZ26001",price:20000,qty:1,views:724,img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=120&q=80"}
  ];

  const body = document.getElementById('productBody');

  function money(n){ return '₦' + n.toLocaleString(); }

  function render(){
    body.innerHTML = products.map((p,i)=>`
      <tr class="product-row border-b border-[#ddd]" data-index="${i}">
        <td>
          <input type="checkbox" class="row-check w-[19px] h-[19px] accent-[#009f3d]">
        </td>
        <td>
          <div class="flex items-center gap-[14px]">
            <img src="${p.img}" class="product-img" alt="">
            <div class="min-w-0">
              <div class="font-semibold text-[14px] truncate max-w-[160px]">${p.name}</div>
              <div class="text-[12px] text-[#999] mt-1">${p.sku}</div>
            </div>
          </div>
        </td>
        <td class="font-semibold text-[14px]">${money(p.price)}</td>
        <td class="font-semibold text-[14px]">${p.qty}</td>
        <td class="font-semibold text-[14px]">${p.views.toLocaleString()}</td>
        <td>
          <button class="status-button h-[33px] w-[110px] border border-[#bbb] rounded-[7px] flex items-center justify-between px-3 text-[13px] bg-white">
            <span class="flex items-center gap-2"><span class="w-[8px] h-[8px] rounded-full bg-[#00bd4c]"></span>Active</span>
            <i data-lucide="chevron-down" class="w-[14px]"></i>
          </button>
        </td>
        <td>
          <div class="flex justify-end items-center gap-3">
            <button class="edit-button h-[33px] px-[14px] rounded-[6px] green text-white text-[13px] font-semibold flex items-center gap-1.5">
              <i data-lucide="pencil" class="w-[15px]"></i>Edit
            </button>
            <button class="delete-button w-[37px] h-[33px] rounded-[6px] border border-[#ccc] flex items-center justify-center hover:bg-red-50">
              <i data-lucide="trash-2" class="w-[17px]"></i>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
    lucide.createIcons();
  }
  render();

  const showSelect = document.getElementById('showFilter');
  const sortSelect = document.getElementById('sortFilter');
  document.getElementById('showText').textContent = showSelect.value;
  document.getElementById('sortText').textContent = sortSelect.value;
  showSelect.addEventListener('change',()=>document.getElementById('showText').textContent=showSelect.value);
  sortSelect.addEventListener('change',()=>document.getElementById('sortText').textContent=sortSelect.value);

  const toast=document.getElementById('toast');
  function toastMsg(msg){
    toast.textContent=msg;
    toast.classList.remove('opacity-0','translate-y-4');
    setTimeout(()=>toast.classList.add('opacity-0','translate-y-4'),2200);
  }

  document.getElementById('selectAll').addEventListener('change',e=>{
    document.querySelectorAll('.row-check').forEach(x=>x.checked=e.target.checked);
  });

  document.addEventListener('click',e=>{
    const del=e.target.closest('.delete-button');
    const edit=e.target.closest('.edit-button');
    const status=e.target.closest('.status-button');
    const page=e.target.closest('.page-btn');

    if(del){
      const row=del.closest('tr');
      const index=Number(row.dataset.index);
      products.splice(index,1);
      render();
      toastMsg('Product deleted');
    }
    if(edit) toastMsg('Edit product');
    if(status) toastMsg('Status: Active');
    if(page){
      document.querySelectorAll('.page-btn').forEach(x=>x.classList.remove('active'));
      page.classList.add('active');
      toastMsg('Page '+page.dataset.page);
    }
  });

  document.getElementById('filterBtn').addEventListener('click',()=>toastMsg('Filters applied'));
  document.getElementById('profile').addEventListener('click',()=>toastMsg('Profile menu'));
  document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')toastMsg('Searching...')});
  document.getElementById('customerSearch').addEventListener('keydown',e=>{if(e.key==='Enter')toastMsg('Customer search applied')});

  const modal=document.getElementById('modal');
  document.getElementById('addBtn').onclick=()=>{modal.classList.remove('hidden');modal.classList.add('flex');document.getElementById('name').focus()};
  document.getElementById('closeModal').onclick=()=>{modal.classList.add('hidden');modal.classList.remove('flex')};
  modal.onclick=e=>{if(e.target===modal){modal.classList.add('hidden');modal.classList.remove('flex')}};

  document.getElementById('productForm').addEventListener('submit',e=>{
    e.preventDefault();
    products.unshift({
      name:document.getElementById('name').value,
      sku:'SKU KZ26001',
      price:Number(document.getElementById('price').value),
      qty:Number(document.getElementById('qty').value),
      views:0,
      img:'https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=120&q=80'
    });
    render();
    e.target.reset();
    modal.classList.add('hidden');modal.classList.remove('flex');
    toastMsg('Product added successfully');
  });
</script>
</body>
</html>
